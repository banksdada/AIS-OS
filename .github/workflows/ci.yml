name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit ruff

      - name: Lint Python sources
        run: ruff check --select E4,E7,E9,F scripts/tidycal_mcp.py scripts/dashboard/generate.py scripts/dashboard/serve.py scripts/dashboard/lodgify.py tests

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      - name: Build Docker image
        run: docker build --tag aios:ci .
